name: tmp-core-build2
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-core-build2.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/split-modules
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Online-Arcana/astrology
          ref: 86fadaebccb497930f6a38a4a8f5c4c15b2c2ff6
          path: _astrology
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build core
        run: |
          set -euo pipefail
          rm -rf /tmp/wheel
          cp -a src /tmp/wheel
          rm -rf src dist vendor package-lock.json
          mkdir -p src/types src/vendor src/hash src/wheel src/calculate src/random
          for d in aspect astro compat derived dignity eclipse house pattern place rules time zodiac; do cp -a "_astrology/src/$d" "src/$d"; done
          cp _astrology/src/types/base.ts src/types/base.ts
          cp _astrology/src/types/astro.ts src/types/astro.ts
          cp _astrology/src/vendor/load.ts src/vendor/load.ts

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/types/base.ts')
          s=p.read_text()
          a=s.index('export type PreferredGender')
          b=s.index('export interface BirthInput', a)
          s=s[:a]+s[b:]
          s=s.replace('  name?: string;\n  lang?: string;\n  preferredGender?: PreferredGender;\n','')
          p.write_text(s)
          PY

          cat > src/vendor/revisions.ts <<'TS'
          export const vendorRevisions = {
            astronomia: { repository: "kitty-crow/astronomia", revision: "ed1064049979b68abb3ff0a7812f5ee4fc04caec", version: "5.1.0" },
            places: { repository: "kitty-crow/countrystatecity", revision: "eaba6b0028b9632d2e2fec9a4a1b78ce3336479d", version: "2.1.2" },
            time: {
              repository: "kitty-crow/ts-joda",
              revision: "96828b6097da77b2de38171dfd1bf92c0df7edc7",
              coreVersion: "7.0.0",
              timezoneVersion: "3.0.0",
              timeZoneDatabaseVersion: "2026a",
              supportedRange: "1900-01-01/2100-12-31",
            },
          } as const;
          TS

          cat > src/types/calc.ts <<'TS'
          import type { Ayanamsha, AstronomyData, CompatibilityMatrix, Zodiac, ZodiacCalculation } from "./astro.js";
          import type { BirthData, JsonRef, PlaceData, TimeData } from "./base.js";

          export interface CalcSettings {

            },
            "dependencies": {
              "@countrystatecity/countries": "file:vendor/places/packages/countries",
              "@js-joda/core": "file:vendor/time/packages/core",
              "@js-joda/timezone": "file:vendor/time/packages/timezone",
              "astronomia": "file:vendor/astronomy"
            },
            "devDependencies": { "@types/node": "^22.15.3", "typescript": "5.9.3" }

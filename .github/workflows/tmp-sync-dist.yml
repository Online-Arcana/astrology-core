name: tmp-sync-dist
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-sync-dist.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and commit exact package state
        run: |
          set -euo pipefail
          npm run vendor:build
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build
          npm test
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git add -f dist
          git commit -m "Regenerate astral-core package state"
          git push origin HEAD:agent/split-modules

name: tmp-migrate-regression-tests
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-migrate-regression-tests.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Restore deterministic regression suite
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/Online-Arcana/astrology/86fadaebccb497930f6a38a4a8f5c4c15b2c2ff6/test
          for file in calculation timeInput geometry points dignity derived patterns eclipses compatibility; do
            curl --fail --silent --show-error "$BASE/$file.ts" -o "test/$file.ts"
          done
          cat > tsconfig.test.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": false,
              "allowImportingTsExtensions": false,
              "outDir": ".test",
              "rootDir": ".",
              "declaration": false,
              "declarationMap": false,
              "sourceMap": false
            },
            "include": ["src/**/*.ts", "test/**/*.ts"]
          }
          JSON
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.scripts['test:regression'] = 'rm -rf .test && tsc -p tsconfig.test.json && node .test/test/calculation.js && node .test/test/timeInput.js && node .test/test/geometry.js && node .test/test/points.js && node .test/test/dignity.js && node .test/test/derived.js && node .test/test/patterns.js && node .test/test/eclipses.js && node .test/test/compatibility.js';
          pkg.scripts.test = 'node test/core.mjs && npm run test:regression';
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          npm run vendor:build
          npm ci
          npm run check
          npm run build
          npm test

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-migrate-regression-tests.yml
          git add package.json tsconfig.test.json test/*.ts
          git commit -m "Restore deterministic regression suite"
          git fetch origin agent/split-modules
          git rebase origin/agent/split-modules
          git push origin HEAD:agent/split-modules

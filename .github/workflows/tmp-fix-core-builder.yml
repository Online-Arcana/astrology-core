name: tmp-fix-core-builder
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-fix-core-builder.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/split-modules
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp-core-build2.yml')
          s=p.read_text()
          old="s=s.replace('ChartWheelCalculation','WheelData').replace('Aspect,','WheelAspect,').replace('renderChartWheel','renderWheel')"
          new="s=s.replace('ChartWheelCalculation','WheelData').replace('renderChartWheel','renderWheel').replace('aspect: Aspect,','aspect: WheelAspect,')"
          if old not in s: raise SystemExit('builder marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-core-build2.yml
          git commit -m "Fix temporary core builder aspect type"
          git push origin HEAD:agent/split-modules

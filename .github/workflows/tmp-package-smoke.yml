name: tmp-package-smoke
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-package-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run vendor:build
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install packed core in an empty consumer
        run: |
          set -euo pipefail
          rm -rf /tmp/astral-core-consumer
          mkdir -p /tmp/astral-core-consumer
          npm pack --pack-destination /tmp/astral-core-consumer
          tar -tzf /tmp/astral-core-consumer/astral-core-0.1.0.tgz > /tmp/astral-core-package.txt
          grep -q 'package/vendor/astronomy/package.json' /tmp/astral-core-package.txt
          grep -q 'package/vendor/places/packages/countries/package.json' /tmp/astral-core-package.txt
          grep -q 'package/vendor/time/packages/core/package.json' /tmp/astral-core-package.txt
          grep -q 'package/vendor/time/packages/timezone/package.json' /tmp/astral-core-package.txt
          cd /tmp/astral-core-consumer
          printf '{"name":"core-consumer","private":true,"type":"module"}\n' > package.json
          npm install ./astral-core-0.1.0.tgz --ignore-scripts
          node -e 'import("astral-core").then(async m => { if (typeof m.renderSvg !== "function") throw new Error("renderSvg export missing"); if (typeof m.emptyWheelData !== "function") throw new Error("emptyWheelData export missing"); if (typeof m.loadPorts !== "function") throw new Error("loadPorts export missing"); await m.loadPorts("package-smoke"); console.log("self-contained astral-core import passed") })'

name: tmp-package-smoke
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-package-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run vendor:build
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install packed core in empty consumers
        run: |
          set -euo pipefail
          rm -rf /tmp/astral-core-consumer
          mkdir -p /tmp/astral-core-consumer
          npm pack --pack-destination /tmp/astral-core-consumer
          tar -tzf /tmp/astral-core-consumer/astral-core-0.1.0.tgz > /tmp/astral-core-package.txt
          if grep -q '^package/vendor/' /tmp/astral-core-package.txt; then
            echo 'vendor source leaked into packed core' >&2
            exit 1
          fi
          grep -q '^package/data/places/countries.json$' /tmp/astral-core-package.txt
          grep -q '^package/dist/wheel.js$' /tmp/astral-core-package.txt
          cd /tmp/astral-core-consumer
          printf '{"name":"core-consumer","private":true,"type":"module"}\n' > package.json
          npm install ./astral-core-0.1.0.tgz --ignore-scripts
          node -e 'import("astral-core").then(async m => { if (typeof m.loadPorts !== "function") throw new Error("loadPorts export missing"); const places = await m.loadCscCatalogue(); const country = await places.countries("Europe"); if (!country.some(x => x.code === "GB")) throw new Error("CSC data unavailable"); await m.loadPorts("package-smoke"); console.log("self-contained astral-core import passed") })'
          node -e 'import("astral-core/wheel").then(m => { if (typeof m.renderSvg !== "function") throw new Error("renderSvg export missing"); if (typeof m.emptyWheelData !== "function") throw new Error("emptyWheelData export missing"); console.log("browser wheel entry import passed") })'

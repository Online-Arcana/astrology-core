name: Refresh generated dist

on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-dist.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Commit generated package output
        run: |
          if git diff --quiet -- dist; then
            echo 'dist is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'Refresh shared chart wheel dist'
          git push

name: tmp-sync-core
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-map.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync generated output and remove helper refs
        run: |
          set -euo pipefail
          npm run vendor:build
          npm ci
          npm run check
          npm run build
          npm test
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist
          git commit -m "Sync astral-core build output" || true
          git push origin HEAD:agent/split-modules
          for ref in agent/split-modules-dist agent/split-modules-dist2 agent/split-modules-dist3 agent/split-modules-dist4 agent/split-modules-dist5 agent/split-modules-dist6 agent/split-modules-dist7 agent/split-modules-dist8 agent/split-modules-dist9; do
            git push origin --delete "$ref" || true
          done

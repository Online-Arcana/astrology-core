name: tmp-core-rerun
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-core-rerun.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/split-modules
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Online-Arcana/astrology
          ref: 86fadaebccb497930f6a38a4a8f5c4c15b2c2ff6
          path: _astrology
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run corrected builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-core-build2.yml').read_text()
          marker='      - name: Build core\n        run: |\n'
          if marker not in src: raise SystemExit('build block not found')
          block=src.split(marker,1)[1]
          lines=[]
          for line in block.splitlines():
            lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'
          script=script.replace(".replace('Aspect,','WheelAspect,')", ".replace('aspect: Aspect,','aspect: WheelAspect,')")
          Path('/tmp/core-build.sh').write_text(script)
          PY
          bash /tmp/core-build.sh

name: Build dist artifact

on:
  push:
    branches:
      - agent/glyph-visibility

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm run vendor:build
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: generated-dist
          path: dist
          if-no-files-found: error
      - name: Commit generated dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Regenerate dist for glyph visibility"
          git push origin HEAD:agent/glyph-visibility

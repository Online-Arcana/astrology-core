name: Apply Roman house labels

on:
  push:
    branches:
      - agent/roman-house-labels

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply Roman house labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          geometry = Path('src/wheel/geometry.ts')
          text = geometry.read_text()
          if 'houseRomanNumeral' not in text:
              marker = 'export const signOrder = ["aries", "taurus", "gemini", "cancer", "leo", "virgo", "libra", "scorpio", "sagittarius", "capricorn", "aquarius", "pisces"] as const satisfies readonly Sign[];\n'
              addition = marker + 'export const houseRomanNumerals = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"] as const;\nexport const houseRomanNumeral = (houseNumber: number): string => houseRomanNumerals[houseNumber] ?? String(houseNumber);\n'
              if marker not in text:
                  raise SystemExit('geometry signOrder marker changed unexpectedly')
              text = text.replace(marker, addition, 1)
              geometry.write_text(text)

          render = Path('src/wheel/render.ts')
          text = render.read_text()
          if 'houseRomanNumeral' not in text:
              old = 'aspectSegment, forward as forwardDistance, normalise,'
              new = 'aspectSegment, forward as forwardDistance, houseRomanNumeral, normalise,'
              if old not in text:
                  raise SystemExit('render geometry import changed unexpectedly')
              text = text.replace(old, new, 1)
          old_label = 'label.textContent = String(house.number);'
          if old_label in text:
              text = text.replace(old_label, 'label.textContent = houseRomanNumeral(house.number);', 1)
          elif 'label.textContent = houseRomanNumeral(house.number);' not in text:
              raise SystemExit('render house label changed unexpectedly')
          render.write_text(text)

          svg = Path('src/wheel/svg.ts')
          text = svg.read_text()
          if 'houseRomanNumeral' not in text:
              old = 'aspectSegment, anchors, forward, normalise,'
              new = 'aspectSegment, anchors, forward, houseRomanNumeral, normalise,'
              if old not in text:
                  raise SystemExit('svg geometry import changed unexpectedly')
              text = text.replace(old, new, 1)
          old_label = '>${h.number}</text>`);}'
          new_label = '>${houseRomanNumeral(h.number)}</text>`);}'
          if old_label in text:
              text = text.replace(old_label, new_label, 1)
          elif new_label not in text:
              raise SystemExit('static SVG house label changed unexpectedly')
          svg.write_text(text)

          tests = Path('test/wheelVisibility.ts')
          text = tests.read_text()
          old_import = 'import { pointLayout } from "../src/wheel/geometry.js";'
          if old_import in text:
              text = text.replace(old_import, 'import { houseRomanNumeral, pointLayout } from "../src/wheel/geometry.js";', 1)
          if 'house labels use Roman numerals' not in text:
              marker = 'await test("hidden points are removed before collision-lane assignment", () => {'
              addition = '''await test("house labels use Roman numerals", () => {
            const expected = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
            for (let index = 0; index < expected.length; index += 1) {
              equal(houseRomanNumeral(index + 1), expected[index], `house ${index + 1}`);
            }
          });

          '''
              if marker not in text:
                  raise SystemExit('wheel visibility test marker changed unexpectedly')
              text = text.replace(marker, addition + marker, 1)
          tests.write_text(text)
          PY
      - run: npm run vendor:build
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- dist || true
      - name: Commit source and generated dist
        run: |
          git add src/wheel/geometry.ts src/wheel/render.ts src/wheel/svg.ts test/wheelVisibility.ts dist
          if git diff --cached --quiet; then
            echo "Roman house labels already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use Roman numerals for house labels"
          git push origin HEAD:agent/roman-house-labels
